source: src
output: dist/raw

context:
  type: object
  properties:
    origins:
      type: object
      properties:
        base:
          type: boolean
          default: false
        fantasy:
          type: boolean
          default: false
        magic:
          type: boolean
          default: false
        mobs:
          type: boolean
          default: false
        greek:
          type: boolean
          default: false
    ability_config:
      type: boolean
      default: true

presets:
  greek:
    origins:
      greek: true

  main:
    origins:
      base: true
      fantasy: true
      magic: true
      mobs: true
      greek: false

overwrite: true
clean_output: true